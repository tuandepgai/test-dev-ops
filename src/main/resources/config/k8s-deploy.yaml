apiVersion: apps/v1
kind: Deployment
metadata:
  name: tuan-app-deployment
  labels:
    app: tuan-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tuan-app
  template:
    metadata:
      labels:
        app: tuan-app
    spec:
      containers:
        - name: tuan-app
          image: localhost:5000/tuan-app:6ec31f4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: tuan-app-service
spec:
  selector:
    app: tuan-app
  type: NodePort
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080
